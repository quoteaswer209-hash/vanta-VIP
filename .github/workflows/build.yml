name: Build VANTA Reporter APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          unzip -q VANTA-Reporter-ready-to-build.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/vanta-reporter
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Reporter-APK
          path: extracted/vanta-reporter/app/build/outputs/apk/debug/app-debug.apk
